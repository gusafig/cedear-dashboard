name: Actualizar datos de mercado

on:
  schedule:
    - cron: "0 10 * * 2-6"   # 10:00 UTC = 07:00 Argentina (martes a sábado -> trae el cierre de lunes a viernes)
  workflow_dispatch:           # permite ejecutarlo manualmente

concurrency:
  group: actualizar-datos-mercado
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install yfinance pandas

      - name: Descargar datos de Yahoo Finance
        run: python scripts/fetch_data.py

      - name: Commit y push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/market_data.json

          if git diff --cached --quiet; then
            echo "Sin cambios en los datos"
            exit 0
          fi

          git commit -m "data: actualizar mercado $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"

          git pull --rebase origin main
          git push origin HEAD:main
