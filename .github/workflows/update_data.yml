name: Actualizar datos de mercado

on:
  schedule:
    - cron: "0 10 * * 2-6"   # 10:00 UTC = 07:00 Argentina (martes a sábado -> trae el cierre de lunes a viernes)
  workflow_dispatch:           # permite ejecutarlo manualmente

concurrency:
  group: actualizar-datos-mercado
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install yfinance pandas

      - name: Descargar datos de Yahoo Finance
        run: python scripts/fetch_data.py

      - name: Commit y push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/market_data.json data/setup_history.json

          if git diff --cached --quiet; then
            echo "Sin cambios en los datos"
            exit 0
          fi

          git commit -m "data: actualizar mercado $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"

          # market_data.json es un archivo generado por completo en cada corrida:
          # si hay conflicto, siempre gana la versión recién calculada (-X ours),
          # no tiene sentido mergear línea por línea un dato que ya quedó viejo.
          for i in 1 2 3 4 5; do
            git fetch origin main

            if git merge -X ours --no-edit origin/main; then
              if git push origin HEAD:main; then
                echo "Push OK"
                exit 0
              fi
            else
              echo "Merge falló, abortando intento $i"
              git merge --abort || true
            fi

            echo "Reintentando en unos segundos... (intento $i)"
            sleep $(( (RANDOM % 10) + 5 ))
          done

          echo "No se pudo pushear después de varios intentos"
          exit 1
