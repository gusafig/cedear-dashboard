name: Actualizar datos de mercado

on:
  schedule:
    - cron: "30 22 * * 1-5"   # 22:30 UTC = 19:30 Argentina (lunes a viernes)
  workflow_dispatch:           # permite ejecutarlo manualmente

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install yfinance pandas

      - name: Descargar datos de Yahoo Finance
        run: python scripts/fetch_data.py

      - name: Commit y push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add data/market_data.json
          
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos"
            exit 0
          fi
          
          git commit -m "data: actualizar mercado $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
          git push origin HEAD:main
